# nginx.conf — Production reverse proxy for Waselni backend.
#
# - Terminates HTTPS (Let's Encrypt certificates).
# - Proxies /api/* to the FastAPI backend (port 8000).
# - Rate limits at the Nginx level (defense in depth — the app also rate limits).
# - Gzip compression for JSON responses.
# - Security headers (X-Content-Type-Options, X-Frame-Options, HSTS).
# - HTTP → HTTPS redirect.
# - WebSocket support for future real-time features.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;  # max request body (10 MB — enough for sync batches)

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/plain;

    # Rate limiting zones
    # login: 5 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    # api: 100 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

    # Upstream — FastAPI backend
    upstream waselni_backend {
        server backend:8000;
        keepalive 32;
    }

    # === HTTP → HTTPS redirect ===
    server {
        listen 80;
        server_name api.waslni.com;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /etc/letsencrypt/acme-challenge;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # === HTTPS server ===
    server {
        listen 443 ssl http2;
        server_name api.waslni.com;

        # SSL certificates (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/api.waslni.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.waslni.com/privkey.pem;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # === Health check (no rate limit) ===
        location = /health {
            proxy_pass http://waselni_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        # === Login endpoint (strict rate limit: 5/min) ===
        location ~ ^/api/v1/auth/login$ {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://waselni_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # === API endpoints (rate limit: 100/min) ===
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://waselni_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # WebSocket support (for future real-time features)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # === OpenAPI docs (disabled in production, but just in case) ===
        location /docs {
            return 404;
        }
        location /redoc {
            return 404;
        }
        location /openapi.json {
            return 404;
        }

        # === Root → health ===
        location = / {
            return 302 /health;
        }
    }
}
