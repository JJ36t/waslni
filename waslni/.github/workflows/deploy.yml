# Deploy — runs when a tag v* is pushed.
# Builds the Docker image → pushes to registry → SSH into server → deploy specific version.

name: Deploy to Production

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_REGISTRY }}/waselni-backend:${{ steps.version.outputs.VERSION }} \
            -t ${{ secrets.DOCKER_REGISTRY }}/waselni-backend:latest \
            .

      - name: Login to container registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ secrets.DOCKER_REGISTRY }} -u ${{ secrets.DOCKER_USER }} --password-stdin

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_REGISTRY }}/waselni-backend:${{ steps.version.outputs.VERSION }}
          docker push ${{ secrets.DOCKER_REGISTRY }}/waselni-backend:latest

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            cd /opt/waselni/backend
            export DOCKER_REGISTRY=${{ secrets.DOCKER_REGISTRY }}
            export WASLNI_VERSION=${{ steps.version.outputs.VERSION }}
            ./scripts/deploy.sh ${{ steps.version.outputs.VERSION }} --migrate
            # Exit code from deploy.sh propagates — if health check fails, CI fails

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ steps.version.outputs.VERSION }}

  build-android-release:
    runs-on: ubuntu-latest
    needs: deploy-backend
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties
        run: |
          echo "MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}" > local.properties
          echo "MAPBOX_DOWNLOADS_TOKEN=${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}" >> local.properties

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.WASLNI_KEYSTORE_BASE64 }}" | base64 -d > /tmp/waselni-release.jks

      - name: Build Release AAB
        env:
          WASLNI_KEYSTORE_FILE: /tmp/waselni-release.jks
          WASLNI_KEYSTORE_PASSWORD: ${{ secrets.WASLNI_KEYSTORE_PASSWORD }}
          WASLNI_KEY_ALIAS: ${{ secrets.WASLNI_KEY_ALIAS }}
          WASLNI_KEY_PASSWORD: ${{ secrets.WASLNI_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-release-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Upload AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/bundle/release/app-release.aab
          tag_name: ${{ github.ref_name }}

      - name: Cleanup keystore
        if: always()
        run: rm -f /tmp/waselni-release.jks
