# Backend CI — runs on every PR and push to develop/main.
# Lint → Type Check → Tests (with PostgreSQL service) → Security Audit → Docker Build.

name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: waselni
          POSTGRES_PASSWORD: waselni
          POSTGRES_DB: waslni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://waselni:waselni@localhost:5432/waslni_test
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      JWT_ALGORITHM: HS256
      APP_ENV: test
      CORS_ORIGINS: http://localhost:8080
      RATE_LIMIT_PER_MINUTE: 100
      LOGIN_RATE_LIMIT_PER_MINUTE: 5
      LOG_LEVEL: WARNING
      LOG_FORMAT: text

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports || true
        continue-on-error: true

      - name: Run migrations
        run: alembic upgrade head

      - name: Tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Security audit (pip-audit)
        run: pip-audit -r requirements.txt --ignore-vuln GHSA-xxxx || true
        continue-on-error: true

      - name: Build Docker image
        run: docker build -t waselni-backend:ci .
