# docker-compose for local development.
# Production deployment uses a separate compose file (docker-compose.prod.yml)
# with Nginx + Gunicorn + Uvicorn workers + managed Postgres.

services:
  db:
    image: postgres:15-alpine
    container_name: waselni-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: waselni
      POSTGRES_PASSWORD: waselni
      POSTGRES_DB: waslni
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waselni -d waslni"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waselni-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://waselni:waselni@db:5432/waslni
      JWT_SECRET: dev-secret-change-me-in-production-32-chars-min
      CORS_ORIGINS: http://localhost:8080,http://10.0.2.2:8080
      LOG_FORMAT: text
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"
    volumes:
      # Mount source for hot-reload during development
      - .:/app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --log-level debug

volumes:
  postgres-data:
